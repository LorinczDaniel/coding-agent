[project]
name = "claude-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "openai>=2.15.0",
    "python-dotenv>=1.0.0",
    "textual>=0.80.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py314"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
